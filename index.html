<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackit - Beta Now Live</title>
    <link rel="icon" type="image/png" href="trackitlogo48.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-background: #fafbfc;
            --color-text: #1e293b;
            --color-text-secondary: #64748b;
            --color-border: #e2e8f0;
            --color-primary: #6760cc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: #151518;
                --color-text: #ffffff;
                --color-text-secondary: #a3a3a3;
                --color-border: #2a2a2e;
            }
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }

        /* Background watermark - centered */
        .bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vmin;
            height: 75vmin;
            opacity: 0.05;
            pointer-events: none;
        }

        /* Header at top */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: var(--color-primary);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
        }

        .logo svg {
            width: 70%;
            height: 70%;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .tagline {
            font-size: 1rem;
            color: var(--color-text-secondary);
        }

        /* CTA center */
        .cta {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .cta-button {
            display: inline-block;
            background: var(--color-primary);
            color: #fff;
            padding: 1.1rem 2.5rem;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            box-shadow: 0 4px 20px rgba(103, 96, 204, 0.3);
            transition: all 0.2s;
        }

        .cta-button:hover {
            background: #5650a8;
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(103, 96, 204, 0.4);
        }

        .platform {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.25rem;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
        }

        footer a {
            color: var(--color-text-secondary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        footer a:hover {
            color: var(--color-primary);
        }

        footer .sep {
            color: var(--color-border);
        }

        @media (max-width: 640px) {
            .header { padding: 1.5rem; }
            .logo { width: 70px; height: 70px; border-radius: 18px; }
            h1 { font-size: 1.5rem; }
            .tagline { font-size: 0.9rem; }
            .cta-button { padding: 1rem 2rem; font-size: 1.1rem; }
            .bg-logo { width: 85vmin; height: 85vmin; opacity: 0.04; }
            footer { gap: 1rem; }
        }
    </style>
</head>
